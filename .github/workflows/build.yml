name: Build AOD Module

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runners ship with Android SDK preinstalled.
      # The setup-android action is intentionally omitted: its legacy
      # `sdkmanager tools` step fails on current SDK repositories.
      - name: Accept SDK licenses and install platform/build-tools
        shell: bash
        run: |
          SDK="$ANDROID_HOME"
          echo "ANDROID_HOME=$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK=$(find . -type f -name '*.apk' | head -n1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          ls -l "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: panoramic-aod-apk
          path: ${{ steps.apk.outputs.path }}

name: Build AOD Module (Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships with Android SDK preinstalled. setup-android@v3
      # is omitted: its legacy `sdkmanager tools` step fails on current repos.
      - name: Accept SDK licenses and install platform/build-tools
        shell: bash
        run: |
          SDK="$ANDROID_HOME"
          echo "ANDROID_HOME=$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble RELEASE APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Locate release APK
        id: apk
        shell: bash
        run: |
          APK=$(find . -type f -path '*release*.apk' | grep -v debug | head -n1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          ls -l "$APK"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: panoramic-aod-release
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
